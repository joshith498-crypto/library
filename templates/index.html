<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE | Zee High School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --glass: rgba(12, 12, 14, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.35);
        }

        .light-theme {
            --bg: #f5f5f7;
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-main: #1d1d1f;
            --text-dim: rgba(0, 0, 0, 0.45);
        }

        body { 
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: background 0.5s ease;
            min-height: 100vh;
        }

        .liquid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: var(--bg);
        }

        .liquid-mesh {
            position: fixed; width: 140vw; height: 140vh; top: -20vh; left: -20vw;
            background-image: radial-gradient(circle at 20% 30%, rgba(0, 122, 255, 0.15) 0%, transparent 40%);
            z-index: -1; filter: blur(100px); animation: drift 25s infinite alternate;
        }

        .hero-text {
            font-family: 'Fraunces', serif;
            background: linear-gradient(to bottom, var(--text-main) 30%, var(--text-dim) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .sovereign-card {
            background: var(--glass);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .nav-link {
            font-size: 10px; font-weight: 800; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--text-dim);
            transition: 0.3s; padding: 10px 20px; border-radius: 14px;
        }
        .nav-link.active { color: var(--text-main); background: rgba(122,122,122,0.1); }

        .btn-sovereign {
            background: var(--text-main); color: var(--bg); font-weight: 800;
            border-radius: 18px; transition: 0.4s; text-transform: uppercase; font-size: 11px;
        }

        #notification { transform: translate(-50%, -150px); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        #notification.show { transform: translate(-50%, 60px); }

        input, textarea { background: rgba(122,122,122,0.05); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); padding: 12px; outline: none; }
    </style>
</head>
<body>

    <div class="liquid-bg"></div>
    <div class="liquid-mesh"></div>

    <div id="notification" class="fixed top-0 left-1/2 -translate-x-1/2 z-[100] sovereign-card px-10 py-5 flex items-center gap-4 border-blue-500">
        <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
        <span id="notifText" class="text-xs font-black uppercase tracking-widest">Done</span>
    </div>

    <!-- Auth System (Login/Register) -->
    <div id="authOverlay" class="fixed inset-0 z-[60] bg-black/90 backdrop-blur-xl flex items-center justify-center p-8">
        <div class="max-w-md w-full space-y-10 text-center">
            <h1 class="text-7xl italic font-serif text-white tracking-tighter">Archive</h1>
            <div class="sovereign-card p-10 space-y-6 bg-white/5 border-white/10">
                <div class="flex gap-4 p-1 bg-black/20 rounded-xl mb-4">
                    <button onclick="toggleAuthMode('login')" id="loginTab" class="flex-1 py-2 rounded-lg text-[10px] font-bold uppercase bg-white/10 text-white">Login</button>
                    <button onclick="toggleAuthMode('register')" id="registerTab" class="flex-1 py-2 rounded-lg text-[10px] font-bold uppercase text-white/40">Register</button>
                </div>
                <input type="text" id="authUser" placeholder="USERNAME" class="w-full text-center">
                <input type="password" id="authPass" placeholder="PASSWORD" class="w-full text-center">
                <button onclick="handleAuth()" id="authBtn" class="w-full btn-sovereign py-5 bg-white text-black">Enter Archive</button>
                <p id="authError" class="text-[10px] font-bold text-red-500 uppercase hidden">Error</p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="dashboardApp" class="hidden min-h-screen flex-col">
        <header class="px-12 py-10 flex justify-between items-center sticky top-0 z-40 bg-white/5 backdrop-blur-3xl border-b border-white/5">
            <div class="flex items-center gap-20">
                <div class="font-serif italic text-4xl font-black tracking-tighter">ZHS</div>
                <nav class="hidden md:flex gap-4">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-link active">Dashboard</button>
                    <button onclick="switchTab('issue')" id="nav-issue" class="nav-link">Issue</button>
                    <button onclick="switchTab('ledger')" id="nav-ledger" class="nav-link">Ledger</button>
                    <button onclick="switchTab('history')" id="nav-history" class="nav-link">History</button>
                    <button onclick="switchTab('settings')" id="nav-settings" class="nav-link">Settings</button>
                </nav>
            </div>
            <button onclick="logout()" class="text-[9px] font-black text-red-500 uppercase tracking-widest">Logout</button>
        </header>

        <main class="max-w-7xl w-full mx-auto p-12 flex-grow">
            
            <!-- Dashboard -->
            <div id="tab-dashboard" class="space-y-20">
                <div class="space-y-4">
                    <h1 class="text-9xl italic tracking-tighter leading-none hero-text">The Archive</h1>
                    <p class="text-[10px] font-bold tracking-[0.4em] uppercase opacity-40">Library Management Suite</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="sovereign-card p-12"><p class="text-[10px] font-bold uppercase opacity-40 mb-4">Books Loaned</p><h3 id="statActiveLoans" class="text-8xl font-serif">0</h3></div>
                    <div class="sovereign-card p-12"><p class="text-[10px] font-bold uppercase opacity-40 mb-4">Total Archived</p><h3 id="statHistory" class="text-8xl font-serif">0</h3></div>
                    <div class="sovereign-card p-12 flex flex-col justify-center items-center"><p id="currentUserDisplay" class="text-xs font-mono uppercase tracking-widest text-blue-500">Curator Active</p></div>
                </div>
                <div class="grid lg:grid-cols-12 gap-20">
                    <div id="leaderboardList" class="lg:col-span-8 space-y-6"></div>
                    <div id="annList" class="lg:col-span-4 space-y-10"></div>
                </div>
            </div>

            <!-- Settings Tab -->
            <div id="tab-settings" class="hidden max-w-2xl mx-auto space-y-12 py-10">
                <div class="sovereign-card p-12 space-y-10">
                    <h2 class="text-4xl italic font-serif">System Settings</h2>
                    
                    <div class="space-y-4 border-b border-white/5 pb-8">
                        <p class="text-[10px] font-bold uppercase tracking-widest opacity-40">Appearance</p>
                        <div class="flex gap-4">
                            <button onclick="setTheme('dark')" class="flex-1 py-4 sovereign-card text-[10px] font-bold uppercase border-white/10">Dark Mode</button>
                            <button onclick="setTheme('light')" class="flex-1 py-4 sovereign-card text-[10px] font-bold uppercase bg-white text-black border-none">Light Mode</button>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <p class="text-[10px] font-bold uppercase tracking-widest opacity-40">Change Password</p>
                        <input type="password" id="newPass" placeholder="NEW PASSWORD" class="w-full">
                        <button onclick="updatePassword()" class="w-full btn-sovereign py-4">Save Password</button>
                    </div>

                    <div class="space-y-4 pt-10">
                        <p class="text-[10px] font-bold uppercase tracking-widest text-red-500">Database Control</p>
                        <button onclick="exportBackup()" class="w-full text-[10px] font-bold uppercase tracking-widest border border-white/10 py-3 rounded-xl hover:bg-blue-500/10">Export Master Backup (.json)</button>
                    </div>
                </div>
            </div>

            <!-- Tabs: Issue, Ledger, History (Remained Same Logic) -->
            <div id="tab-issue" class="hidden max-w-2xl mx-auto py-10"><div class="sovereign-card p-16 space-y-10">
                <h2 class="text-5xl italic font-serif">Issue Book</h2>
                <input type="text" id="admNo" placeholder="ADMISSION ID" class="w-full"><input type="text" id="studentName" placeholder="STUDENT NAME" class="w-full"><input type="text" id="bookName" placeholder="BOOK TITLE" class="w-full"><button onclick="submitIssue()" class="w-full btn-sovereign py-6">Commit Transaction</button>
            </div></div>
            <div id="tab-ledger" class="hidden space-y-8"><h2 class="text-6xl italic font-serif">Ledger</h2><div id="issuesTable" class="space-y-4"></div></div>
            <div id="tab-history" class="hidden space-y-8"><h2 class="text-6xl italic font-serif">History</h2><div id="historyTable" class="space-y-4"></div></div>

        </main>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('lib_users')) || [];
        let db = JSON.parse(localStorage.getItem('lib_db_sovereign')) || { issues: [], history: [], notices: [] };
        let activeUser = null;
        let authMode = 'login';

        // AUTH ENGINE
        function toggleAuthMode(mode) {
            authMode = mode;
            document.getElementById('loginTab').className = mode === 'login' ? 'flex-1 py-2 rounded-lg text-[10px] font-bold uppercase bg-white/10 text-white' : 'flex-1 py-2 rounded-lg text-[10px] font-bold uppercase text-white/40';
            document.getElementById('registerTab').className = mode === 'register' ? 'flex-1 py-2 rounded-lg text-[10px] font-bold uppercase bg-white/10 text-white' : 'flex-1 py-2 rounded-lg text-[10px] font-bold uppercase text-white/40';
            document.getElementById('authBtn').innerText = mode === 'login' ? 'Enter Archive' : 'Create Account';
        }

        function handleAuth() {
            const u = document.getElementById('authUser').value.trim();
            const p = document.getElementById('authPass').value.trim();
            const error = document.getElementById('authError');

            if(!u || !p) return alert("Fields Required");

            if(authMode === 'register') {
                if(users.find(user => user.username === u)) {
                    error.innerText = "Username Taken";
                    error.classList.remove('hidden');
                    return;
                }
                const newUser = { username: u, password: p, theme: 'dark' };
                users.push(newUser);
                localStorage.setItem('lib_users', JSON.stringify(users));
                showToast("Account Registered");
                toggleAuthMode('login');
            } else {
                const user = users.find(user => user.username === u && user.password === p);
                if(user) {
                    activeUser = user;
                    document.getElementById('authOverlay').style.display = 'none';
                    document.getElementById('dashboardApp').classList.remove('hidden');
                    document.getElementById('currentUserDisplay').innerText = `Curator: ${u}`;
                    setTheme(user.theme);
                    refreshUI();
                } else {
                    error.innerText = "Invalid Login";
                    error.classList.remove('hidden');
                }
            }
        }

        // SETTINGS & THEME
        function setTheme(theme) {
            const html = document.getElementById('mainHtml');
            if(theme === 'light') html.classList.add('light-theme');
            else html.classList.remove('light-theme');
            if(activeUser) {
                activeUser.theme = theme;
                localStorage.setItem('lib_users', JSON.stringify(users));
            }
        }

        function updatePassword() {
            const np = document.getElementById('newPass').value;
            if(!np) return alert("Enter New Password");
            activeUser.password = np;
            localStorage.setItem('lib_users', JSON.stringify(users));
            showToast("Password Updated");
        }

        function logout() { location.reload(); }

        // LIBRARY LOGIC
        function saveData() {
            localStorage.setItem('lib_db_sovereign', JSON.stringify(db));
            refreshUI();
        }

        function showToast(txt) {
            const t = document.getElementById('notification');
            document.getElementById('notifText').innerText = txt;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function switchTab(t) {
            ['dashboard', 'issue', 'ledger', 'history', 'settings'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                document.getElementById(`nav-${tab}`).classList.remove('active');
            });
            document.getElementById(`tab-${t}`).classList.remove('hidden');
            document.getElementById(`nav-${t}`).classList.add('active');
        }

        function submitIssue() {
            const i = { id: Date.now(), adm: document.getElementById('admNo').value, name: document.getElementById('studentName').value, book: document.getElementById('bookName').value, date: new Date().toLocaleDateString() };
            db.issues.push(i);
            saveData();
            showToast("Issued Successfully");
            switchTab('ledger');
        }

        function returnBook(id) {
            const idx = db.issues.findIndex(item => item.id === id);
            const book = db.issues.splice(idx, 1)[0];
            book.returnDate = new Date().toLocaleDateString();
            db.history.unshift(book);
            saveData();
            showToast("Returned Successfully");
        }

        function refreshUI() {
            document.getElementById('statActiveLoans').innerText = db.issues.length;
            document.getElementById('statHistory').innerText = db.history.length;

            document.getElementById('issuesTable').innerHTML = db.issues.map(i => `
                <div class="sovereign-card p-8 flex justify-between items-center">
                    <div><p class="font-bold text-xl">${i.name}</p><p class="text-[10px] opacity-40 uppercase">ID: ${i.adm}</p></div>
                    <div class="italic font-serif text-xl opacity-80">${i.book}</div>
                    <button onclick="returnBook(${i.id})" class="text-[10px] font-bold text-blue-500 border border-blue-500/20 px-6 py-2 rounded-xl">Return</button>
                </div>
            `).join('') || '<p class="text-center py-20 opacity-20 uppercase font-black tracking-widest">No Active Loans</p>';

            document.getElementById('historyTable').innerHTML = db.history.map(i => `
                <div class="sovereign-card p-8 flex justify-between items-center opacity-60">
                    <div><p class="font-bold text-lg">${i.name}</p><p class="text-[9px] opacity-40">ID: ${i.adm}</p></div>
                    <div class="italic font-serif text-lg">${i.book}</div>
                    <div class="text-[9px] font-bold text-blue-500 uppercase">${i.returnDate}</div>
                </div>
            `).join('') || '<p class="text-center py-20 opacity-20 uppercase font-black tracking-widest">No History</p>';
        }

        function exportBackup() {
            const blob = new Blob([JSON.stringify(db)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `ZHS_Master_Archive.json`;
            link.click();
        }
    </script>
</body>
</html>
