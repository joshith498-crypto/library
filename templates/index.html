<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zee High School | Library Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Sophisticated Font Pairing: Fraunces (Serif) & Geist (Sans) -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Geist', 'sans-serif'],
                        serif: ['Fraunces', 'serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-base: #0c0d0e;
            --surface: #14161a;
            --accent: #2d4a3e; /* Academic Forest Green */
            --border: rgba(255, 255, 255, 0.08);
        }

        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-base);
            color: #d4d4d8;
        }

        /* Subtle film grain to remove "AI Slop" smoothness */
        body::before {
            content: "";
            fixed: inset 0;
            width: 100%; height: 100%;
            position: fixed;
            z-index: 50;
            pointer-events: none;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        h1, h2, h3, .stat-value { font-family: 'Fraunces', serif; }

        /* Crisp Archival Borders instead of glowing shadows */
        .school-card {
            background: var(--surface);
            border: 1px solid var(--border);
            position: relative;
            transition: border-color 0.2s ease;
        }

        .school-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .glow-button {
            background: #e4e4e7;
            color: #0c0d0e;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .glow-button:hover {
            background: #ffffff;
            transform: translateY(-1px);
        }

        /* Technical Data Styling */
        .font-mono { font-size: 0.8rem; letter-spacing: -0.02em; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #27272a; }
    </style>
</head>
<body class="text-zinc-100 min-h-screen flex flex-col selection:bg-zinc-200 selection:text-black">

    <!-- Auth Portal Overlay -->
    <div id="loginOverlay" class="fixed inset-0 z-50 bg-[#0c0d0e]/98 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="school-card p-10 rounded-lg w-full max-w-md space-y-8 border-zinc-800">
            <div class="text-center space-y-3">
                <div class="h-16 w-16 rounded-full bg-zinc-800 text-zinc-100 flex items-center justify-center mx-auto text-xl font-serif border border-zinc-700 italic">Z</div>
                <h2 class="text-2xl font-bold text-white tracking-tight">The Archive</h2>
                <p class="text-xs text-zinc-500 font-mono uppercase tracking-widest">Administrative Access Only</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="loginPass" placeholder="Access Code" class="w-full bg-zinc-900/50 border border-zinc-800 rounded-none px-4 py-3.5 text-sm text-white placeholder-zinc-700 focus:outline-none focus:border-zinc-500 transition font-mono">
                <button onclick="attemptLogin()" class="w-full glow-button py-3.5 rounded-none text-xs uppercase tracking-widest transition">Establish Connection</button>
                <p id="loginError" class="text-[10px] text-rose-500 text-center hidden font-mono uppercase">Invalid security credentials</p>
            </div>
        </div>
    </div>

    <!-- Main Dashboard Application -->
    <div id="dashboardApp" class="hidden flex-col flex-grow min-h-screen">
        <header class="bg-black/40 backdrop-blur-xl border-b border-white/5 sticky top-0 z-40 px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-10">
                <div class="flex items-center gap-3">
                    <div class="font-serif italic text-2xl font-bold tracking-tighter text-white">ZHS</div>
                    <div class="h-4 w-[1px] bg-zinc-800"></div>
                    <span class="text-[10px] text-zinc-500 font-mono uppercase tracking-[0.2em]">Library Portal</span>
                </div>
                <nav class="hidden md:flex items-center gap-6 text-[11px] font-mono uppercase tracking-widest">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="text-white border-b border-white pb-1">Dashboard</button>
                    <button onclick="switchTab('issue')" id="nav-issue" class="text-zinc-500 hover:text-white transition">Issue</button>
                    <button onclick="switchTab('ledger')" id="nav-ledger" class="text-zinc-500 hover:text-white transition">Ledger</button>
                    <button onclick="switchTab('history')" id="nav-history" class="text-zinc-500 hover:text-white transition">History</button>
                </nav>
            </div>
            <div class="flex items-center gap-4">
                <button onclick=
