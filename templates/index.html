<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE | Zee High School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Cloud SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900&family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --glass: rgba(10, 10, 15, 0.6);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.45);
            --accent: #007AFF;
        }

        .light-theme {
            --bg: #fbfbfd;
            --glass: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(0, 0, 0, 0.12);
            --text-main: #000000;
            --text-dim: #555555;
        }

        body { 
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: all 0.8s cubic-bezier(0.2, 0, 0, 1);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ultimate Liquid Background */
        .liquid-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: var(--bg); }
        .liquid-mesh {
            position: absolute; width: 150vw; height: 150vh; top: -25vh; left: -25vw;
            background-image: radial-gradient(circle at 20% 30%, rgba(0, 122, 255, 0.18) 0%, transparent 40%),
                              radial-gradient(circle at 80% 70%, rgba(255, 0, 128, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 50% 10%, rgba(0, 255, 255, 0.05) 0%, transparent 30%);
            filter: blur(100px); animation: drift 35s infinite alternate;
        }
        @keyframes drift { from { transform: rotate(0deg); } to { transform: rotate(12deg) scale(1.15); } }

        /* Physical Glass Material */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(100px) saturate(250%) contrast(110%);
            -webkit-backdrop-filter: blur(100px) saturate(250%) contrast(110%);
            border: 1px solid var(--glass-border);
            border-radius: 44px;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.05);
            position: relative; overflow: hidden;
        }

        .glass-card::after {
            content: ""; position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.035; pointer-events: none; mix-blend-mode: overlay;
        }

        .hero-text {
            font-family: 'Fraunces', serif; font-weight: 900;
            background: linear-gradient(180deg, var(--text-main) 60%, var(--text-dim) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .nav-link {
            font-size: 11px; font-weight: 900; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--text-dim);
            transition: 0.4s; padding: 12px 28px; border-radius: 20px;
        }
        .nav-link.active { color: var(--text-main); background: rgba(255,255,255,0.1); }

        .btn-action {
            background: #FFFFFF; color: #000000; font-weight: 900;
            border-radius: 24px; transition: 0.5s; text-transform: uppercase; font-size: 13px; letter-spacing: 0.15em;
        }
        .btn-action:hover { transform: translateY(-6px); box-shadow: 0 30px 50px rgba(0,122,255,0.25); }

        input {
            background: transparent !important; border: none !important;
            border-bottom: 4px solid var(--glass-border) !important;
            border-radius: 0 !important; color: var(--text-main) !important;
            padding: 1.8rem 0 !important; outline: none !important;
            transition: 0.5s; font-family: 'Fraunces', serif;
            font-style: italic; font-weight: 700; font-size: 2.6rem; width: 100%;
        }
        input:focus { border-bottom-color: var(--accent) !important; }

        .reveal { animation: revealEffect 1.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes revealEffect { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }

        #notification { transform: translate(-50%, -150px); transition: 0.6s; z-index: 2000; }
        #notification.show { transform: translate(-50%, 60px); }

        .tag-mono { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 800; background: rgba(0,122,255,0.1); color: var(--accent); padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="liquid-bg"><div class="liquid-mesh"></div></div>

    <div id="notification" class="fixed top-0 left-1/2 -translate-x-1/2 glass-card px-10 py-5 flex items-center gap-5 border-blue-500/50">
        <div class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_20px_#007AFF] animate-pulse"></div>
        <span id="notifText" class="text-sm font-black uppercase tracking-widest text-white">Confirmed</span>
    </div>

    <!-- Auth -->
    <div id="authOverlay" class="fixed inset-0 z-[60] bg-black flex items-center justify-center p-8">
        <div class="max-w-md w-full space-y-16 text-center reveal">
            <h1 class="text-[10rem] italic font-serif text-white tracking-tighter leading-none">Archive</h1>
            <div class="glass-card p-14 space-y-12">
                <input type="password" id="loginPass" placeholder="PASSKEY" class="text-center">
                <button onclick="attemptLogin()" class="w-full btn-action py-8 text-xl">Enter Cloud</button>
            </div>
        </div>
    </div>

    <!-- App -->
    <div id="dashboardApp" class="hidden min-h-screen flex-col">
        <header class="px-12 py-12 flex justify-between items-center sticky top-0 z-40 bg-black/5 backdrop-blur-3xl border-b border-white/5">
            <div class="flex items-center gap-20">
                <div class="font-serif italic text-5xl text-white font-black tracking-tighter cursor-pointer" onclick="switchTab('dashboard')">ZHS</div>
                <nav class="hidden md:flex gap-4">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-link active">Dashboard</button>
                    <button onclick="switchTab('issue')" id="nav-issue" class="nav-link">Issue</button>
                    <button onclick="switchTab('ledger')" id="nav-ledger" class="nav-link">Ledger</button>
                    <button onclick="switchTab('overdue')" id="nav-overdue" class="nav-link text-red-400">Overdue</button>
                    <button onclick="switchTab('history')" id="nav-history" class="nav-link">History</button>
                    <button onclick="switchTab('settings')" id="nav-settings" class="nav-link">Settings</button>
                </nav>
            </div>
            <button onclick="location.reload()" class="text-xs font-black text-red-500 uppercase tracking-widest">Logout</button>
        </header>

        <main class="max-w-[1700px] w-full mx-auto p-12 flex-grow">
            
            <!-- Dashboard Tab -->
            <div id="tab-dashboard" class="space-y-40 reveal">
                <h1 class="text-[16rem] italic tracking-tighter leading-[0.7] hero-text">The Archive</h1>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-14">
                    <div class="glass-card p-20 space-y-8">
                        <p class="text-xs font-black opacity-30 uppercase tracking-[0.5em]">Active Circulation</p>
                        <h3 id="statActive" class="text-[12rem] font-serif tracking-tighter leading-none">0</h3>
                    </div>
                    <div class="glass-card p-20 space-y-8">
                        <p class="text-xs font-black opacity-30 uppercase tracking-[0.5em]">Overdue Policy</p>
                        <h3 id="statOverdue" class="text-[12rem] font-serif tracking-tighter leading-none text-red-500">0</h3>
                    </div>
                    <div class="glass-card p-20 flex flex-col justify-center items-center border-blue-500/20">
                        <div class="text-blue-500 uppercase tracking-[0.6em] font-black text-sm mb-12">Cloud Live</div>
                        <div class="w-12 h-12 rounded-full bg-blue-500 animate-pulse shadow-[0_0_80px_#007AFF]"></div>
                    </div>
                </div>
                <div id="leadGrid" class="space-y-10"></div>
            </div>

            <!-- Issue Tab -->
            <div id="tab-issue" class="hidden max-w-5xl mx-auto py-10 reveal">
                <div class="glass-card p-28 space-y-24">
                    <h2 class="text-[8rem] italic font-serif leading-none tracking-tighter">Issue</h2>
                    <div class="flex flex-col space-y-12">
                        <input type="text" id="iAdm" placeholder="ADMISSION ID" onkeyup="detectStudent(this.value)" autocomplete="off">
                        
                        <!-- Returning Scholar Banner -->
                        <div id="studentStatus" class="hidden p-10 border-l-8 border-blue-500 bg-blue-500/5 rounded-3xl reveal">
                            <p class="text-blue-400 font-black text-sm uppercase tracking-widest mb-3">Identity Verified</p>
                            <h4 id="foundName" class="text-6xl italic font-serif text-white">Full Name</h4>
                            <p id="foundClass" class="text-xl text-white/40 mt-2">Class</p>
                        </div>

                        <!-- New Student Fields -->
                        <div id="newStudentFields" class="hidden space-y-10 reveal">
                            <p class="text-blue-500 text-xs font-black uppercase tracking-widest">New Student Initialized</p>
                            <input type="text" id="iName" placeholder="SCHOLAR FULL NAME">
                            <input type="text" id="iClass" placeholder="CLASS & SECTION">
                        </div>

                        <input type="text" id="iBook" placeholder="BOOK CODE">
                        <button onclick="issueNow()" class="btn-action py-12 mt-16 text-3xl">Register Loan</button>
                    </div>
                </div>
            </div>

            <!-- Ledger Tab -->
            <div id="tab-ledger" class="hidden space-y-20 reveal"><h2 class="text-[10rem] italic font-serif font-bold uppercase">Ledger</h2><div id="ledgerGrid" class="space-y-12"></div></div>
            
            <!-- Overdue Tab -->
            <div id="tab-overdue" class="hidden space-y-20 reveal"><h2 class="text-[10rem] italic font-serif font-bold uppercase text-red-500">Overdue</h2><div id="overdueGrid" class="space-y-12"></div></div>
            
            <!-- History Tab -->
            <div id="tab-history" class="hidden space-y-20 reveal"><h2 class="text-[10rem] italic font-serif font-bold uppercase">History</h2><div id="historyGrid" class="space-y-12"></div></div>

            <!-- Settings Tab -->
            <div id="tab-settings" class="hidden max-w-5xl mx-auto py-10 reveal">
                <div class="glass-card p-24 space-y-20">
                    <h2 class="text-8xl italic font-serif">System</h2>
                    <button onclick="setTheme('dark')" class="py-10 glass-card w-full text-sm font-black uppercase">Obsidian</button>
                    <button onclick="setTheme('light')" class="py-10 glass-card w-full text-sm font-black uppercase bg-white text-black border-none">Alpine</button>
                    <button onclick="exportCSV()" class="py-6 border-2 border-emerald-500/50 rounded-3xl text-xs font-black text-emerald-500 uppercase tracking-widest hover:bg-emerald-500/10 transition">Spreadsheet (.csv)</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 1. FIREBASE INITIALIZATION (EXACT KEYS FROM YOUR SCREENSHOT)
        const firebaseConfig = {
            apiKey: "AIzaSyAyTODBohXLiLFdjnrjK4YGJSGcHIc4hUc",
            authDomain: "the-archive-79cd9.firebaseapp.com",
            projectId: "the-archive-79cd9",
            storageBucket: "the-archive-79cd9.firebasestorage.app",
            messagingSenderId: "168411716812",
            appId: "1:168411716812:web:4837ea2bdfe538d23db669",
            measurementId: "G-NWL665HWCF"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. SMART SCHOLAR DETECTION
        async function detectStudent(id) {
            const status = document.getElementById('studentStatus');
            const newFields = document.getElementById('newStudentFields');
            if (id.length < 3) { status.classList.add('hidden'); newFields.classList.add('hidden'); return; }

            const doc = await db.collection('students').doc(id).get();
            if (doc.exists) {
                status.classList.remove('hidden');
                newFields.classList.add('hidden');
                document.getElementById('foundName').innerText = doc.data().name;
                document.getElementById('foundClass').innerText = doc.data().class;
            } else {
                status.classList.add('hidden');
                newFields.classList.remove('hidden');
            }
        }

        // 3. CORE TRANSACTIONS
        async function issueNow() {
            const adm = document.getElementById('iAdm').value;
            const book = document.getElementById('iBook').value;
            if(!adm || !book) return;

            let name, classSec;
            const doc = await db.collection('students').doc(adm).get();
            if(doc.exists) {
                name = doc.data().name; classSec = doc.data().class;
            } else {
                name = document.getElementById('iName').value;
                classSec = document.getElementById('iClass').value;
                if(!name || !classSec) return alert("Register Scholar Name & Class");
                await db.collection('students').doc(adm).set({ name, class: classSec });
            }

            const now = new Date();
            const due = new Date(); due.setDate(now.getDate() + 7);

            await db.collection('issues').add({
                adm, name, class: classSec, book,
                issueDate: now.toISOString(),
                dueDate: due.toISOString()
            });

            showToast("ARCHIVE UPDATED");
            switchTab('ledger');
            ['iAdm', 'iName', 'iClass', 'iBook'].forEach(id => document.getElementById(id).value = '');
            detectStudent('');
        }

        async function retBook(id, data) {
            await db.collection('history').add({ ...data, returnDate: new Date().toISOString() });
            await db.collection('issues').doc(id).delete();
            showToast("VOLUME RETURNED");
        }

        // 4. CLOUD SYNC ENGINE
        function syncCloud() {
            db.collection('issues').onSnapshot(snap => {
                const issues = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderLedger(issues);
                renderOverdue(issues);
                updateStats(issues);
                renderLeaderboard();
            });
            db.collection('history').orderBy('returnDate', 'desc').limit(50).onSnapshot(snap => {
                renderHistory(snap.docs.map(d => d.data()));
            });
        }

        function updateStats(issues) {
            const overdue = issues.filter(i => new Date(i.dueDate) < new Date());
            document.getElementById('statActive').innerText = issues.length;
            document.getElementById('statOverdue').innerText = overdue.length;
        }

        function renderLedger(data) {
            document.getElementById('ledgerGrid').innerHTML = data.map(i => `
                <div class="glass-card p-16 flex justify-between items-center">
                    <div>
                        <p class="font-black text-6xl">${i.name} <span class="opacity-30 text-xl font-normal">[${i.class}]</span></p>
                        <p class="text-[11px] opacity-40 uppercase tracking-widest mt-6">ID: ${i.adm} • DUE: ${new Date(i.dueDate).toLocaleDateString()}</p>
                    </div>
                    <div class="italic font-serif text-6xl text-blue-500">${i.book}</div>
                    <button onclick="retBook('${i.id}', ${JSON.stringify(i).replace(/"/g, '&quot;')})" class="btn-action px-16 py-8 text-xs">Return</button>
                </div>`).join('');
        }

        function renderOverdue(data) {
            const overdue = data.filter(i => new Date(i.dueDate) < new Date());
            document.getElementById('overdueGrid').innerHTML = overdue.map(i => `
                <div class="glass-card p-16 flex justify-between items-center border-red-500/40">
                    <div>
                        <p class="font-black text-6xl text-red-500">${i.name} [${i.class}]</p>
                        <p class="text-xs opacity-40 uppercase mt-4">ADM ID: ${i.adm} • DEFAULTER</p>
                    </div>
                    <div class="text-right">
                        <p class="tag-mono !bg-red-500/20 !text-red-500 mb-4 inline-block">7-Day Violation</p>
                        <p class="italic font-serif text-5xl">${i.book}</p>
                    </div>
                </div>`).join('') || '<p class="text-center opacity-10 text-9xl py-40 uppercase font-black">Zero Overdue</p>';
        }

        function renderHistory(data) {
            document.getElementById('historyGrid').innerHTML = data.map(i => `
                <div class="glass-card p-16 opacity-50 flex flex-col space-y-8">
                    <div class="flex justify-between items-end">
                        <div><p class="font-black text-5xl">${i.name} [${i.class}]</p><p class="text-xs opacity-40 mt-4 uppercase">ID: ${i.adm}</p></div>
                        <div class="italic font-serif text-5xl">${i.book}</div>
                    </div>
                    <div class="grid grid-cols-2 gap-10 border-t border-white/5 pt-10">
                        <div><span class="tag-mono mb-4 inline-block">Issued</span><p class="text-4xl font-serif italic">${new Date(i.issueDate).toLocaleDateString()}</p></div>
                        <div><span class="tag-mono mb-4 inline-block !bg-blue-500/20">Returned</span><p class="text-4xl font-serif italic text-blue-500 font-black">${new Date(i.returnDate).toLocaleDateString()}</p></div>
                    </div>
                </div>`).join('');
        }

        async function renderLeaderboard() {
            const hSnap = await db.collection('history').get();
            const iSnap = await db.collection('issues').get();
            const c = {};
            [...hSnap.docs, ...iSnap.docs].forEach(d => { c[d.data().name] = (c[d.data().name] || 0) + 1; });
            const sorted = Object.entries(c).sort((a,b) => b[1] - a[1]).slice(0, 5);
            document.getElementById('leadGrid').innerHTML = sorted.map(([n, v], idx) => `
                <div class="glass-card p-20 flex justify-between items-center group">
                    <div class="flex items-center gap-20">
                        <span class="text-[12rem] italic font-serif opacity-10 group-hover:opacity-100 transition duration-700">0${idx+1}</span>
                        <p class="font-black text-8xl tracking-tighter">${n}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-9xl font-serif italic">${v}</span>
                        <p class="text-xs font-black opacity-20 uppercase mt-8 tracking-widest">Books Borrowed</p>
                    </div>
                </div>`).join('');
        }

        // 5. UTILS
        function attemptLogin() {
            if (document.getElementById('loginPass').value === 'librarian123') {
                document.getElementById('authOverlay').classList.add('hidden');
                document.getElementById('dashboardApp').classList.remove('hidden');
                syncCloud();
            }
        }

        function switchTab(t) {
            ['dashboard', 'issue', 'ledger', 'overdue', 'history', 'settings'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                document.getElementById(`nav-${tab}`).classList.remove('active');
            });
            document.getElementById(`tab-${t}`).classList.remove('hidden');
            document.getElementById(`nav-${t}`).classList.add('active');
        }

        function setTheme(t) {
            const h = document.getElementById('mainHtml');
            t === 'light' ? h.classList.add('light-theme') : h.classList.remove('light-theme');
        }

        function exportCSV() {
            let csv = "Admission ID,Name,Class,Book Code,Issue Date,Return Date\n";
            db.collection('history').get().then(snap => {
                snap.forEach(d => {
                    const i = d.data();
                    csv += `${i.adm},${i.name},${i.class},${i.book},${i.issueDate},${i.returnDate}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob); a.download = "Library_Master_List.csv"; a.click();
            });
        }

        function showToast(t) {
            const n = document.getElementById('notification');
            document.getElementById('notifText').innerText = t;
            n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
