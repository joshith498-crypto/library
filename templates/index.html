<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE | Zee High School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --glass: rgba(15, 15, 18, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.4);
            --accent: #007AFF;
        }

        .light-theme {
            --bg: #fbfbfd;
            --glass: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(0, 0, 0, 0.06);
            --text-main: #1d1d1f;
            --text-dim: rgba(0, 0, 0, 0.5);
            --accent: #007AFF;
        }

        body { 
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: background 0.8s cubic-bezier(0.2, 0, 0, 1);
            min-height: 100vh;
        }

        /* Organic Liquid Mesh */
        .liquid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: var(--bg);
            overflow: hidden;
        }

        .liquid-mesh {
            position: absolute; width: 150vw; height: 150vh; top: -25vh; left: -25vw;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 122, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
            filter: blur(120px);
            animation: drift 40s ease-in-out infinite alternate;
        }

        @keyframes drift {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(8deg) scale(1.1); }
        }

        /* Film Grain Texture - The "Anti-AI" Secret */
        .grain-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.025; pointer-events: none; z-index: 50;
        }

        .hero-text {
            font-family: 'Fraunces', serif;
            background: linear-gradient(180deg, var(--text-main) 40%, var(--text-dim) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 20px 80px -20px rgba(0,0,0,0.5);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-link {
            font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
            text-transform: uppercase; color: var(--text-dim);
            transition: 0.3s; padding: 10px 20px; border-radius: 12px;
        }
        .nav-link.active { color: var(--text-main); background: rgba(122,122,122,0.1); }

        .btn-sovereign {
            background: var(--text-main); color: var(--bg); font-weight: 800;
            border-radius: 16px; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase; font-size: 11px; letter-spacing: 0.1em;
        }
        .btn-sovereign:hover { transform: scale(1.03) translateY(-2px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }

        /* THE RESTORED TEXTBOX STYLE */
        input, textarea {
            background: transparent !important;
            border: none !important;
            border-bottom: 1px solid var(--glass-border) !important;
            border-radius: 0 !important;
            color: var(--text-main) !important;
            padding: 1.2rem 0 !important;
            outline: none !important;
            transition: 0.4s ease;
            font-family: 'Fraunces', serif;
            font-style: italic;
            width: 100%;
        }
        input:focus { border-bottom-color: var(--accent) !important; }

        .reveal { animation: revealEffect 1s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes revealEffect { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        #notification { transform: translate(-50%, -150px); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 1000; }
        #notification.show { transform: translate(-50%, 60px); }
    </style>
</head>
<body>

    <div class="liquid-bg"><div class="liquid-mesh"></div></div>
    <div class="grain-overlay"></div>

    <div id="notification" class="fixed top-0 left-1/2 -translate-x-1/2 glass-card px-10 py-5 flex items-center gap-4 border-blue-500/40">
        <div class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_15px_#007AFF] animate-pulse"></div>
        <span id="notifText" class="text-xs font-black uppercase tracking-[0.2em]">Transaction Confirmed</span>
    </div>

    <!-- Auth System -->
    <div id="authOverlay" class="fixed inset-0 z-[60] bg-black flex items-center justify-center p-8">
        <div class="max-w-md w-full space-y-16 text-center reveal">
            <h1 class="text-8xl italic font-serif text-white tracking-tighter">Archive</h1>
            <div class="glass-card p-12 space-y-8">
                <div class="flex gap-4 p-1 bg-black/20 rounded-2xl">
                    <button onclick="toggleAuth('login')" id="logTab" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-white/10 text-white transition">Login</button>
                    <button onclick="toggleAuth('register')" id="regTab" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase text-white/40 transition">Register</button>
                </div>
                <div class="space-y-2">
                    <input type="text" id="authUser" placeholder="USERNAME" class="text-center">
                    <input type="password" id="authPass" placeholder="PASSWORD" class="text-center">
                </div>
                <button onclick="handleAuth()" id="authBtn" class="w-full btn-sovereign py-6">Enter Archive</button>
                <p id="authError" class="text-[10px] font-bold text-red-500 uppercase hidden">Invalid Credentials</p>
            </div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="dashboardApp" class="hidden min-h-screen flex-col">
        <header class="px-12 py-10 flex justify-between items-center sticky top-0 z-40 bg-black/5 backdrop-blur-3xl border-b border-white/5">
            <div class="flex items-center gap-16">
                <div class="font-serif italic text-4xl text-white font-black tracking-tighter cursor-pointer" onclick="switchTab('dashboard')">ZHS</div>
                <nav class="hidden md:flex gap-2">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-link active">Dashboard</button>
                    <button onclick="switchTab('issue')" id="nav-issue" class="nav-link">Issue</button>
                    <button onclick="switchTab('ledger')" id="nav-ledger" class="nav-link">Ledger</button>
                    <button onclick="switchTab('history')" id="nav-history" class="nav-link">History</button>
                    <button onclick="switchTab('settings')" id="nav-settings" class="nav-link">Settings</button>
                </nav>
            </div>
            <button onclick="location.reload()" class="text-[9px] font-black text-red-500 uppercase tracking-widest hover:opacity-70 transition">Exit System</button>
        </header>

        <main class="max-w-7xl w-full mx-auto p-12 flex-grow reveal">
            
            <!-- Dashboard -->
            <div id="tab-dashboard" class="space-y-24">
                <div class="space-y-4">
                    <h1 class="text-9xl md:text-[11rem] italic tracking-tighter leading-none hero-text">The Archive</h1>
                    <p id="curatorInfo" class="text-xs font-bold tracking-[0.5em] uppercase opacity-40">Zee High School | Archival Suite</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                    <div class="glass-card p-12 space-y-4">
                        <p class="text-[10px] font-black opacity-30 uppercase tracking-[0.3em]">Active Circulation</p>
                        <h3 id="statActive" class="text-8xl font-serif">0</h3>
                    </div>
                    <div class="glass-card p-12 space-y-4">
                        <p class="text-[10px] font-black opacity-30 uppercase tracking-[0.3em]">Lifetime History</p>
                        <h3 id="statHistory" class="text-8xl font-serif">0</h3>
                    </div>
                    <div class="glass-card p-12 flex flex-col justify-center items-center">
                        <div class="text-blue-500 uppercase tracking-[0.3em] font-black text-[11px] mb-4">Core Online</div>
                        <div class="w-4 h-4 rounded-full bg-blue-500 animate-pulse shadow-[0_0_20px_#007AFF]"></div>
                    </div>
                </div>
                <div class="grid lg:grid-cols-12 gap-20">
                    <div class="lg:col-span-8 space-y-10">
                        <h3 class="text-3xl italic font-serif opacity-80">Reader Engagement</h3>
                        <div id="leadList" class="space-y-6"></div>
                    </div>
                    <div class="lg:col-span-4 space-y-10">
                        <div class="flex justify-between items-center border-b border-white/10 pb-6">
                            <h3 class="text-3xl italic font-serif opacity-80">Notices</h3>
                            <button onclick="openNote()" class="text-3xl font-light opacity-30 hover:opacity-100 transition">+</button>
                        </div>
                        <div id="notifList" class="space-y-12"></div>
                    </div>
                </div>
            </div>

            <!-- Settings -->
            <div id="tab-settings" class="hidden max-w-3xl mx-auto py-10 space-y-10">
                <div class="glass-card p-20 space-y-16">
                    <h2 class="text-5xl italic font-serif">Preferences</h2>
                    <div class="space-y-8 border-b border-white/5 pb-10">
                        <p class="text-[10px] font-black uppercase opacity-30 tracking-widest">Interface Theme</p>
                        <div class="flex gap-4">
                            <button onclick="setMode('dark')" class="flex-1 py-5 glass-card text-[10px] font-black uppercase">Obsidian</button>
                            <button onclick="setMode('light')" class="flex-1 py-5 glass-card text-[10px] font-black uppercase bg-white text-black border-none">Alpine</button>
                        </div>
                    </div>
                    <div class="space-y-8">
                        <p class="text-[10px] font-black uppercase opacity-30 tracking-widest">Data Management</p>
                        <button onclick="dlBackup()" class="w-full text-blue-500 border border-blue-500/20 py-4 rounded-2xl text-[10px] font-black uppercase hover:bg-blue-500/10 transition">Download Master Backup (.json)</button>
                    </div>
                </div>
            </div>

            <!-- Issue -->
            <div id="tab-issue" class="hidden max-w-3xl mx-auto py-10">
                <div class="glass-card p-20 space-y-16">
                    <h2 class="text-6xl italic font-serif">Create Entry</h2>
                    <div class="space-y-6">
                        <input type="text" id="iAdm" placeholder="SCHOLAR ADMISSION ID" class="text-3xl">
                        <input type="text" id="iName" placeholder="SCHOLAR FULL NAME" class="text-3xl">
                        <input type="text" id="iBook" placeholder="PUBLICATION TITLE" class="text-3xl">
                        <button onclick="issueNow()" class="w-full btn-sovereign py-8 mt-10 text-xl">Confirm Registration</button>
                    </div>
                </div>
            </div>

            <!-- Ledger & History -->
            <div id="tab-ledger" class="hidden space-y-12">
                <h2 class="text-7xl italic font-serif font-bold tracking-tighter uppercase">Active Ledger</h2>
                <div id="ledgerGrid" class="space-y-6"></div>
            </div>
            <div id="tab-history" class="hidden space-y-12">
                <h2 class="text-7xl italic font-serif font-bold tracking-tighter uppercase">History Log</h2>
                <div id="historyGrid" class="space-y-6"></div>
            </div>

        </main>
    </div>

    <!-- Broadcast Modal -->
    <div id="noteModal" class="fixed inset-0 z-[70] bg-black/95 backdrop-blur-3xl hidden items-center justify-center p-8">
        <div class="glass-card p-16 max-w-lg w-full space-y-10">
            <h3 class="text-4xl italic font-serif">Post Notice</h3>
            <div class="space-y-4">
                <input type="text" id="nTitle" placeholder="HEADLINE" class="text-2xl">
                <textarea id="nDesc" rows="4" placeholder="CONTENT..." class="text-xl"></textarea>
                <button onclick="postNote()" class="w-full btn-sovereign py-6">Publish Broadcast</button>
                <button onclick="closeNote()" class="w-full text-[10px] font-bold opacity-30 uppercase">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('zhs_users_v5')) || [];
        let db = JSON.parse(localStorage.getItem('zhs_db_v5')) || { issues: [], history: [], notes: [] };
        let activeUser = null;
        let mode = 'login';

        function toggleAuth(m) {
            mode = m;
            document.getElementById('logTab').className = m === 'login' ? 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-white/10 text-white' : 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase text-white/40';
            document.getElementById('regTab').className = m === 'register' ? 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-white/10 text-white' : 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase text-white/40';
            document.getElementById('authBtn').innerText = m === 'login' ? 'Enter Archive' : 'Create Account';
        }

        function handleAuth() {
            const u = document.getElementById('authUser').value.trim();
            const p = document.getElementById('authPass').value.trim();
            if(!u || !p) return;

            if(mode === 'register') {
                if(users.find(x => x.u === u)) return alert("Curator exists");
                users.push({u, p, theme: 'dark'});
                localStorage.setItem('zhs_users_v5', JSON.stringify(users));
                showToast("ACCOUNT CREATED");
                toggleAuth('login');
            } else {
                const found = users.find(x => x.u === u && x.p === p);
                if(found) {
                    activeUser = found;
                    document.getElementById('authOverlay').style.display='none';
                    document.getElementById('dashboardApp').classList.remove('hidden');
                    document.getElementById('curatorInfo').innerText = `ZEE HIGH SCHOOL | CURATOR: ${u.toUpperCase()}`;
                    setMode(found.theme);
                    sync();
                } else { document.getElementById('authError').classList.remove('hidden'); }
            }
        }

        function setMode(t) {
            const h = document.getElementById('mainHtml');
            t === 'light' ? h.classList.add('light-theme') : h.classList.remove('light-theme');
            if(activeUser) { activeUser.theme = t; localStorage.setItem('zhs_users_v5', JSON.stringify(users)); }
        }

        function sync() {
            localStorage.setItem('zhs_db_v5', JSON.stringify(db));
            document.getElementById('statActive').innerText = db.issues.length;
            document.getElementById('statHistory').innerText = db.history.length;

            document.getElementById('ledgerGrid').innerHTML = db.issues.map(i => `
                <div class="glass-card p-10 flex justify-between items-center reveal">
                    <div><p class="font-bold text-3xl">${i.name}</p><p class="text-[10px] opacity-30 uppercase mt-2">ID: ${i.adm}</p></div>
                    <div class="italic font-serif text-3xl opacity-80">${i.book}</div>
                    <button onclick="retBook(${i.id})" class="btn-sovereign px-10 py-4 text-[10px]">Return</button>
                </div>`).join('') || '<p class="text-center opacity-10 uppercase py-20 text-3xl font-black">Archive Empty</p>';

            document.getElementById('historyGrid').innerHTML = db.history.map(i => `
                <div class="glass-card p-8 flex justify-between items-center opacity-40 reveal">
                    <div><p class="font-bold text-2xl">${i.name}</p></div>
                    <div class="italic font-serif text-2xl">${i.book}</div>
                    <div class="text-[10px] font-black uppercase text-blue-500 font-mono">${i.rDate}</div>
                </div>`).join('');

            const c = {}; [...db.issues, ...db.history].forEach(x => c[x.name] = (c[x.name] || 0) + 1);
            const s = Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);
            document.getElementById('leadList').innerHTML = s.map(([n,v],idx) => `
                <div class="glass-card p-10 flex justify-between items-center reveal">
                    <div class="flex items-center gap-12"><span class="text-7xl italic font-serif opacity-10">0${idx+1}</span><p class="font-bold text-3xl">${n}</p></div>
                    <div class="text-right"><span class="text-5xl font-serif italic">${v}</span></div>
                </div>`).join('');

            document.getElementById('notifList').innerHTML = db.notes.map(n => `
                <div class="space-y-6 reveal border-b border-white/5 pb-10">
                    <div class="flex justify-between items-center"><span class="text-[9px] opacity-20 uppercase font-black">${n.date}</span><button onclick="delNote(${n.id})" class="text-red-500/30 text-[9px] hover:text-red-500 transition">Wipe</button></div>
                    <p class="text-4xl italic font-serif leading-tight">${n.title}</p><p class="text-xl opacity-40 font-light">${n.desc}</p>
                </div>`).join('');
        }

        function switchTab(t) {
            ['dashboard', 'issue', 'ledger', 'history', 'settings'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                document.getElementById(`nav-${tab}`).classList.remove('active');
            });
            document.getElementById(`tab-${t}`).classList.remove('hidden');
            document.getElementById(`nav-${t}`).classList.add('active');
        }

        function issueNow() {
            const i = { id: Date.now(), adm: document.getElementById('iAdm').value, name: document.getElementById('iName').value, book: document.getElementById('iBook').value, date: new Date().toLocaleDateString() };
            if(!i.adm || !i.book) return;
            db.issues.push(i); sync(); showToast("ENTRY RECORDED"); switchTab('ledger');
            ['iAdm', 'iName', 'iBook'].forEach(id => document.getElementById(id).value = '');
        }

        function retBook(id) {
            const idx = db.issues.findIndex(x => x.id === id);
            const item = db.issues.splice(idx,1)[0];
            item.rDate = new Date().toLocaleDateString();
            db.history.unshift(item); sync(); showToast("VOLUME RETURNED");
        }

        function postNote() {
            db.notes.unshift({ id: Date.now(), title: document.getElementById('nTitle').value, desc: document.getElementById('nDesc').value, date: new Date().toLocaleDateString() });
            sync(); closeNote(); showToast("NOTICE PUBLISHED");
        }

        function delNote(id) { db.notes = db.notes.filter(x => x.id !== id); sync(); }
        function openNote() { document.getElementById('noteModal').classList.remove('hidden'); document.getElementById('noteModal').classList.add('flex'); }
        function closeNote() { document.getElementById('noteModal').classList.add('hidden'); }
        function showToast(t) { const n = document.getElementById('notification'); document.getElementById('notifText').innerText = t; n.classList.add('show'); setTimeout(()=>n.classList.remove('show'), 3000); }
        function dlBackup() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:'application/json'})); a.download = 'Archive_Backup.json'; a.click(); }
    </script>
</body>
</html>
