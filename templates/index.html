<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE | Zee High School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400&family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020203;
            --glass: rgba(14, 14, 16, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.4);
            --accent: #007AFF;
        }

        /* ALPINE LIGHT MODE - REBUILT FOR READABILITY */
        .light-theme {
            --bg: #f5f5f7;
            --glass: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.15);
            --text-main: #000000;
            --text-dim: #444444;
            --accent: #0062cc;
        }

        .light-theme body { font-weight: 600; } /* Bolder overall weight for light mode */
        .light-theme .hero-text { -webkit-text-fill-color: #000 !important; background: none; }
        .light-theme input { border-bottom: 2px solid #000 !important; font-weight: 800; }

        body { 
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: all 0.5s cubic-bezier(0.2, 0, 0, 1);
            min-height: 100vh;
        }

        /* The "Anti-AI" Grainy Texture */
        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.03; pointer-events: none; z-index: 50;
        }

        .liquid-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: var(--bg); }
        .liquid-mesh {
            position: absolute; width: 140vw; height: 140vh; top: -20vh; left: -20vw;
            background-image: radial-gradient(circle at 20% 30%, rgba(0, 122, 255, 0.12) 0%, transparent 40%),
                              radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
            filter: blur(100px); animation: drift 30s infinite alternate;
        }
        @keyframes drift { from { transform: rotate(0deg) scale(1); } to { transform: rotate(10deg) scale(1.1); } }

        .hero-text {
            font-family: 'Fraunces', serif; font-weight: 900;
            background: linear-gradient(180deg, var(--text-main) 50%, var(--text-dim) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(50px) saturate(200%);
            -webkit-backdrop-filter: blur(50px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            box-shadow: 0 30px 100px -20px rgba(0,0,0,0.4);
        }

        .nav-link {
            font-size: 11px; font-weight: 900; letter-spacing: 0.15em;
            text-transform: uppercase; color: var(--text-dim);
            transition: 0.3s; padding: 12px 24px; border-radius: 16px;
        }
        .nav-link.active { color: var(--text-main); background: rgba(122,122,122,0.1); }

        .btn-action {
            background: var(--text-main); color: var(--bg); font-weight: 900;
            border-radius: 20px; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase; font-size: 12px; letter-spacing: 0.1em;
        }
        .btn-action:hover { transform: scale(1.03) translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }

        input, textarea {
            background: transparent !important;
            border: none !important;
            border-bottom: 3px solid var(--glass-border) !important;
            border-radius: 0 !important;
            color: var(--text-main) !important;
            padding: 1.5rem 0 !important;
            outline: none !important;
            transition: 0.4s ease;
            font-family: 'Fraunces', serif;
            font-style: italic; font-weight: 700; font-size: 2rem;
        }
        input:focus { border-bottom-color: var(--accent) !important; }

        #notification { transform: translate(-50%, -150px); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 1000; }
        #notification.show { transform: translate(-50%, 60px); }
    </style>
</head>
<body>

    <div class="noise"></div>
    <div class="liquid-bg"><div class="liquid-mesh"></div></div>

    <div id="notification" class="fixed top-0 left-1/2 -translate-x-1/2 glass-card px-10 py-5 flex items-center gap-5 border-blue-500/40">
        <div class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_20px_#007AFF] animate-pulse"></div>
        <span id="notifText" class="text-sm font-black uppercase tracking-widest text-white">Action Confirmed</span>
    </div>

    <!-- Auth System -->
    <div id="authOverlay" class="fixed inset-0 z-[60] bg-black flex items-center justify-center p-8">
        <div class="max-w-md w-full space-y-16 text-center">
            <h1 class="text-9xl italic font-serif text-white tracking-tighter">Archive</h1>
            <div class="glass-card p-14 space-y-10">
                <div class="flex gap-4 p-1 bg-white/5 rounded-3xl">
                    <button onclick="toggleAuth('login')" id="logTab" class="flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-white/10 text-white transition">Login</button>
                    <button onclick="toggleAuth('register')" id="regTab" class="flex-1 py-4 rounded-2xl text-xs font-black uppercase text-white/30 transition">Register</button>
                </div>
                <div class="space-y-2">
                    <input type="text" id="authUser" placeholder="USERNAME" class="text-center !text-2xl">
                    <input type="password" id="authPass" placeholder="PASSWORD" class="text-center !text-2xl">
                </div>
                <button onclick="handleAuth()" id="authBtn" class="w-full btn-action py-7 text-lg">Enter Suite</button>
                <p id="authError" class="text-xs font-black text-red-500 uppercase hidden tracking-widest">Access Denied</p>
            </div>
        </div>
    </div>

    <!-- Main Interface -->
    <div id="dashboardApp" class="hidden min-h-screen flex-col">
        <header class="px-12 py-10 flex justify-between items-center sticky top-0 z-40 bg-black/5 backdrop-blur-3xl border-b border-white/5">
            <div class="flex items-center gap-20">
                <div class="font-serif italic text-4xl text-white font-black tracking-tighter cursor-pointer" onclick="switchTab('dashboard')">ZHS</div>
                <nav class="hidden md:flex gap-4">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-link active">Dashboard</button>
                    <button onclick="switchTab('issue')" id="nav-issue" class="nav-link">Issue</button>
                    <button onclick="switchTab('ledger')" id="nav-ledger" class="nav-link">Ledger</button>
                    <button onclick="switchTab('history')" id="nav-history" class="nav-link">History</button>
                    <button onclick="switchTab('settings')" id="nav-settings" class="nav-link">Settings</button>
                </nav>
            </div>
            <button onclick="location.reload()" class="text-xs font-black text-red-500 uppercase tracking-widest">Logout System</button>
        </header>

        <main class="max-w-[1600px] w-full mx-auto p-12 flex-grow">
            
            <!-- Dashboard -->
            <div id="tab-dashboard" class="space-y-32">
                <div class="space-y-8">
                    <h1 class="text-[14rem] italic tracking-tighter leading-[0.8] hero-text">The Archive</h1>
                    <p id="curatorBadge" class="text-lg font-black tracking-[0.6em] uppercase opacity-40">Zee High School | Library Suite v4.0</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
                    <div class="glass-card p-16 space-y-6">
                        <p class="text-xs font-black opacity-30 uppercase tracking-[0.4em]">Active Circulation</p>
                        <h3 id="statActive" class="text-[10rem] font-serif tracking-tighter leading-none">0</h3>
                    </div>
                    <div class="glass-card p-16 space-y-6">
                        <p class="text-xs font-black opacity-30 uppercase tracking-[0.4em]">Archived Logs</p>
                        <h3 id="statHistory" class="text-[10rem] font-serif tracking-tighter leading-none">0</h3>
                    </div>
                    <div class="glass-card p-16 flex flex-col justify-center items-center border-blue-500/20">
                        <div class="text-blue-500 uppercase tracking-[0.5em] font-black text-xs mb-8">System Online</div>
                        <div class="w-8 h-8 rounded-full bg-blue-500 animate-pulse shadow-[0_0_50px_#007AFF]"></div>
                    </div>
                </div>

                <div class="grid lg:grid-cols-12 gap-24">
                    <div class="lg:col-span-8 space-y-16">
                        <h3 class="text-5xl italic font-serif opacity-90">Scholarly Leaderboard</h3>
                        <div id="leadGrid" class="space-y-8"></div>
                    </div>
                    <div class="lg:col-span-4 space-y-16">
                        <div class="flex justify-between items-center border-b-2 border-white/10 pb-8">
                            <h3 class="text-5xl italic font-serif opacity-90">Broadcasts</h3>
                            <button onclick="openNote()" class="text-5xl font-light text-white/20 hover:text-white transition hover:scale-125">+</button>
                        </div>
                        <div id="noteList" class="space-y-16"></div>
                    </div>
                </div>
            </div>

            <!-- Settings -->
            <div id="tab-settings" class="hidden max-w-4xl mx-auto py-10">
                <div class="glass-card p-24 space-y-20">
                    <h2 class="text-7xl italic font-serif">Preferences</h2>
                    <div class="space-y-12">
                        <p class="text-xs font-black uppercase tracking-[0.4em] opacity-30">Theme Engine</p>
                        <div class="grid grid-cols-2 gap-8">
                            <button onclick="setMode('dark')" class="py-7 glass-card text-xs font-black uppercase hover:border-white transition">Obsidian Obsidian</button>
                            <button onclick="setMode('light')" class="py-7 glass-card text-xs font-black uppercase bg-white text-black border-none transition">Alpine Sequoia</button>
                        </div>
                    </div>
                    <div class="space-y-12 border-t border-white/10 pt-16">
                        <p class="text-xs font-black uppercase tracking-[0.4em] opacity-30">Data Export</p>
                        <div class="grid grid-cols-2 gap-8">
                            <button onclick="exportJSON()" class="py-6 border-2 border-blue-500/40 rounded-3xl text-xs font-black text-blue-400 uppercase tracking-widest hover:bg-blue-500/10 transition">Backup Database (.json)</button>
                            <button onclick="exportCSV()" class="py-6 border-2 border-emerald-500/40 rounded-3xl text-xs font-black text-emerald-400 uppercase tracking-widest hover:bg-emerald-500/10 transition">Google Sheets (.csv)</button>
                        </div>
                        <label class="block w-full py-6 glass-card text-center text-xs font-black uppercase text-amber-400 cursor-pointer border-amber-400/20 hover:border-amber-400 transition">
                            Restore Archive <input type="file" onchange="importBackup(event)" class="hidden">
                        </label>
                    </div>
                </div>
            </div>

            <!-- Issue -->
            <div id="tab-issue" class="hidden max-w-4xl mx-auto py-10">
                <div class="glass-card p-24 space-y-20">
                    <h2 class="text-8xl italic font-serif">Create Entry</h2>
                    <div class="flex flex-col space-y-10">
                        <input type="text" id="iAdm" placeholder="SCHOLAR ADMISSION ID">
                        <input type="text" id="iName" placeholder="SCHOLAR FULL NAME">
                        <input type="text" id="iBook" placeholder="PUBLICATION TITLE">
                        <button onclick="issueNow()" class="btn-action py-10 mt-12 text-2xl">Confirm Loan</button>
                    </div>
                </div>
            </div>

            <!-- Ledger & History -->
            <div id="tab-ledger" class="hidden space-y-16">
                <h2 class="text-9xl italic font-serif font-bold tracking-tighter">Ledger</h2>
                <div id="ledgerGrid" class="space-y-10"></div>
            </div>
            <div id="tab-history" class="hidden space-y-16">
                <h2 class="text-9xl italic font-serif font-bold tracking-tighter">History</h2>
                <div id="historyGrid" class="space-y-10"></div>
            </div>

        </main>
    </div>

    <!-- Notice Modal -->
    <div id="noteModal" class="fixed inset-0 z-[70] bg-black/95 backdrop-blur-3xl hidden items-center justify-center p-8">
        <div class="glass-card p-20 max-w-xl w-full space-y-12">
            <h3 class="text-5xl italic font-serif">Broadcast</h3>
            <div class="flex flex-col space-y-8">
                <input type="text" id="nTitle" placeholder="HEADLINE" class="!text-3xl">
                <textarea id="nDesc" rows="4" placeholder="MESSAGE..." class="!text-2xl !italic !font-serif !bg-transparent !border-b-2 !border-white/10 !outline-none"></textarea>
                <button onclick="postNote()" class="btn-action py-8 text-xl">Publish</button>
                <button onclick="closeNote()" class="text-xs font-black opacity-30 uppercase tracking-widest">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('zhs_auth_v6')) || [];
        let db = JSON.parse(localStorage.getItem('zhs_db_v6')) || { issues: [], history: [], notes: [] };
        let activeUser = null;
        let authMode = 'login';

        function toggleAuth(m) {
            authMode = m;
            document.getElementById('logTab').className = m === 'login' ? 'flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-white/10 text-white' : 'flex-1 py-4 rounded-2xl text-xs font-black uppercase text-white/30';
            document.getElementById('regTab').className = m === 'register' ? 'flex-1 py-4 rounded-2xl text-xs font-black uppercase bg-white/10 text-white' : 'flex-1 py-4 rounded-2xl text-xs font-black uppercase text-white/30';
            document.getElementById('authBtn').innerText = m === 'login' ? 'Enter Suite' : 'Register Curator';
        }

        function handleAuth() {
            const u = document.getElementById('authUser').value.trim();
            const p = document.getElementById('authPass').value.trim();
            if(!u || !p) return;

            if(authMode === 'register') {
                if(users.find(x => x.u === u)) return alert("Curator exists");
                users.push({u, p, theme: 'dark'});
                localStorage.setItem('zhs_auth_v6', JSON.stringify(users));
                showToast("ACCOUNT CREATED");
                toggleAuth('login');
            } else {
                const found = users.find(x => x.u === u && x.p === p);
                if(found) {
                    activeUser = found;
                    document.getElementById('authOverlay').style.display='none';
                    document.getElementById('dashboardApp').classList.remove('hidden');
                    document.getElementById('curatorBadge').innerText = `ZEE HIGH SCHOOL | CURATOR: ${u.toUpperCase()}`;
                    setMode(found.theme);
                    sync();
                } else { document.getElementById('authError').classList.remove('hidden'); }
            }
        }

        function setMode(t) {
            const h = document.getElementById('mainHtml');
            t === 'light' ? h.classList.add('light-theme') : h.classList.remove('light-theme');
            if(activeUser) { activeUser.theme = t; localStorage.setItem('zhs_auth_v6', JSON.stringify(users)); }
        }

        function sync() {
            localStorage.setItem('zhs_db_v6', JSON.stringify(db));
            document.getElementById('statActive').innerText = db.issues.length;
            document.getElementById('statHistory').innerText = db.history.length;

            document.getElementById('ledgerGrid').innerHTML = db.issues.map(i => `
                <div class="glass-card p-14 flex justify-between items-center">
                    <div><p class="font-black text-4xl">${i.name}</p><p class="text-xs opacity-40 uppercase tracking-widest mt-4">ADM: ${i.adm}</p></div>
                    <div class="italic font-serif text-4xl opacity-80">${i.book}</div>
                    <button onclick="retBook(${i.id})" class="btn-action px-12 py-5 text-xs">Return</button>
                </div>`).join('') || '<p class="text-center opacity-10 uppercase py-32 text-4xl font-black">Archive Empty</p>';

            document.getElementById('historyGrid').innerHTML = db.history.map(i => `
                <div class="glass-card p-10 flex justify-between items-center opacity-40">
                    <div><p class="font-black text-3xl">${i.name}</p></div>
                    <div class="italic font-serif text-3xl">${i.book}</div>
                    <div class="text-xs font-black uppercase text-blue-500 font-mono">${i.rDate}</div>
                </div>`).join('');

            const c = {}; [...db.issues, ...db.history].forEach(x => c[x.name] = (c[x.name] || 0) + 1);
            const s = Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);
            document.getElementById('leadGrid').innerHTML = s.map(([n,v],idx) => `
                <div class="glass-card p-16 flex justify-between items-center">
                    <div class="flex items-center gap-16"><span class="text-9xl italic font-serif opacity-10">0${idx+1}</span><p class="font-black text-5xl tracking-tighter">${n}</p></div>
                    <div class="text-right"><span class="text-7xl font-serif italic">${v}</span><p class="text-xs font-black opacity-20 uppercase tracking-widest">Logs</p></div>
                </div>`).join('');

            document.getElementById('noteList').innerHTML = db.notes.map(n => `
                <div class="space-y-8 border-b-2 border-white/5 pb-16">
                    <div class="flex justify-between items-center"><span class="text-xs opacity-20 uppercase font-black">${n.date}</span><button onclick="delNote(${n.id})" class="text-red-500/30 text-xs font-black hover:text-red-500">Wipe</button></div>
                    <p class="text-6xl italic font-serif leading-tight">${n.title}</p><p class="text-2xl opacity-40 font-light">${n.desc}</p>
                </div>`).join('');
        }

        function switchTab(t) {
            ['dashboard', 'issue', 'ledger', 'history', 'settings'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                document.getElementById(`nav-${tab}`).classList.remove('active');
            });
            document.getElementById(`tab-${t}`).classList.remove('hidden');
            document.getElementById(`nav-${t}`).classList.add('active');
        }

        function issueNow() {
            const i = { id: Date.now(), adm: document.getElementById('iAdm').value, name: document.getElementById('iName').value, book: document.getElementById('iBook').value, date: new Date().toLocaleDateString() };
            if(!i.adm || !i.book) return;
            db.issues.push(i); sync(); showToast("ENTRY SAVED"); switchTab('ledger');
            ['iAdm', 'iName', 'iBook'].forEach(id => document.getElementById(id).value = '');
        }

        function retBook(id) {
            const idx = db.issues.findIndex(x => x.id === id);
            const item = db.issues.splice(idx,1)[0];
            item.rDate = new Date().toLocaleDateString();
            db.history.unshift(item); sync(); showToast("VOLUME ARCHIVED");
        }

        function postNote() {
            db.notes.unshift({ id: Date.now(), title: document.getElementById('nTitle').value, desc: document.getElementById('nDesc').value, date: new Date().toLocaleDateString() });
            sync(); closeNote(); showToast("BROADCAST LIVE");
        }

        function exportCSV() {
            let csv = "Admission ID,Name,Book,Issue Date,Return Date\n";
            db.issues.forEach(i => csv += `${i.adm},${i.name},${i.book},${i.date},Active\n`);
            db.history.forEach(i => csv += `${i.adm},${i.name},${i.book},${i.date},${i.rDate}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "Library_Master_Spreadsheet.csv";
            link.click();
            showToast("SPREADSHEET GENERATED");
        }

        function delNote(id) { db.notes = db.notes.filter(x => x.id !== id); sync(); }
        function openNote() { document.getElementById('noteModal').classList.remove('hidden'); document.getElementById('noteModal').classList.add('flex'); }
        function closeNote() { document.getElementById('noteModal').classList.add('hidden'); }
        function showToast(t) { const n = document.getElementById('notification'); document.getElementById('notifText').innerText = t; n.classList.add('show'); setTimeout(()=>n.classList.remove('show'), 3000); }
        function exportJSON() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:'application/json'})); a.download = 'Archive_Backup.json'; a.click(); }
        function importBackup(e) { const f = e.target.files[0]; const r = new FileReader(); r.onload=(ev) => { db = JSON.parse(ev.target.result); sync(); showToast("RESTORED"); }; r.readAsText(f); }
    </script>
</body>
</html>
