<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE | Zee High School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --glass: rgba(12, 12, 14, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.35);
            --input-border: rgba(255, 255, 255, 0.1);
        }

        .light-theme {
            --bg: #f5f5f7;
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-main: #1d1d1f;
            --text-dim: rgba(0, 0, 0, 0.45);
            --input-border: rgba(0, 0, 0, 0.1);
        }

        body { 
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            transition: background 0.5s ease;
        }

        .liquid-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: var(--bg); }
        .liquid-mesh {
            position: fixed; width: 140vw; height: 140vh; top: -20vh; left: -20vw;
            background-image: radial-gradient(circle at 20% 30%, rgba(0, 122, 255, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.06) 0%, transparent 40%);
            z-index: -1; filter: blur(100px); animation: drift 25s ease-in-out infinite alternate;
        }
        @keyframes drift { from { transform: rotate(0deg) scale(1); } to { transform: rotate(5deg) scale(1.1); } }

        .hero-text {
            font-family: 'Fraunces', serif;
            background: linear-gradient(to bottom, var(--text-main) 30%, var(--text-dim) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .sovereign-card {
            background: var(--glass);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-link {
            font-size: 10px; font-weight: 800; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--text-dim);
            transition: 0.3s; padding: 10px 20px; border-radius: 14px;
        }
        .nav-link.active { color: var(--text-main); background: rgba(122,122,122,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        .btn-sovereign {
            background: var(--text-main); color: var(--bg); font-weight: 800;
            border-radius: 18px; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase; font-size: 11px; letter-spacing: 0.1em;
        }
        .btn-sovereign:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,255,255,0.3); }

        /* THE ORIGINAL TEXTBOX STYLE */
        input, textarea {
            background: transparent !important;
            border: none !important;
            border-bottom: 2px solid var(--input-border) !important;
            border-radius: 0 !important;
            color: var(--text-main) !important;
            padding: 1.5rem 0 !important;
            outline: none !important;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: 'Fraunces', serif;
            font-style: italic;
        }
        input:focus { border-bottom-color: #007AFF !important; }

        .reveal { animation: revealEffect 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes revealEffect { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        #notification { transform: translate(-50%, -150px); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 999; }
        #notification.show { transform: translate(-50%, 60px); }
    </style>
</head>
<body>

    <div class="liquid-bg"></div>
    <div class="liquid-mesh"></div>

    <!-- Notification -->
    <div id="notification" class="fixed top-0 left-1/2 -translate-x-1/2 sovereign-card px-12 py-5 flex items-center gap-5 border-blue-500/40">
        <div class="w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_20px_#007AFF] animate-pulse"></div>
        <span id="notifText" class="text-xs font-black uppercase tracking-[0.3em] text-white">System Synchronized</span>
    </div>

    <!-- Multi-User Auth Overlay -->
    <div id="authOverlay" class="fixed inset-0 z-[60] bg-black flex items-center justify-center p-8">
        <div class="max-w-md w-full space-y-16 text-center reveal">
            <h1 class="text-8xl italic font-serif text-white tracking-tighter">Archive</h1>
            <div class="sovereign-card p-12 space-y-8">
                <div class="flex gap-4 p-1 bg-black/20 rounded-2xl mb-4">
                    <button onclick="toggleAuthMode('login')" id="loginTab" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-white/10 text-white">Login</button>
                    <button onclick="toggleAuthMode('register')" id="registerTab" class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase text-white/40">Register</button>
                </div>
                <input type="text" id="authUser" placeholder="USERNAME" class="w-full text-center">
                <input type="password" id="authPass" placeholder="PASSWORD" class="w-full text-center">
                <button onclick="handleAuth()" id="authBtn" class="w-full btn-sovereign py-6">Enter Archive</button>
                <p id="authError" class="text-[10px] font-bold text-red-500 uppercase hidden tracking-widest">Invalid Entry</p>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboardApp" class="hidden min-h-screen flex-col">
        <header class="px-12 py-12 flex justify-between items-center sticky top-0 z-40 bg-black/10 backdrop-blur-3xl border-b border-white/5">
            <div class="flex items-center gap-24">
                <div class="font-serif italic text-4xl text-white font-black tracking-tighter hover:scale-110 transition cursor-pointer" onclick="switchTab('dashboard')">ZHS</div>
                <nav class="hidden md:flex gap-4">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-link active">Dashboard</button>
                    <button onclick="switchTab('issue')" id="nav-issue" class="nav-link">Issue</button>
                    <button onclick="switchTab('ledger')" id="nav-ledger" class="nav-link">Ledger</button>
                    <button onclick="switchTab('history')" id="nav-history" class="nav-link">History</button>
                    <button onclick="switchTab('settings')" id="nav-settings" class="nav-link">Settings</button>
                </nav>
            </div>
            <button onclick="logout()" class="text-[9px] font-black text-red-500/50 uppercase tracking-[0.3em]">Exit System</button>
        </header>

        <main class="max-w-7xl w-full mx-auto p-12 flex-grow reveal">
            
            <!-- Dashboard Tab -->
            <div id="tab-dashboard" class="space-y-28">
                <div class="space-y-6">
                    <h1 class="text-[12rem] italic tracking-tighter leading-none hero-text">The Archive</h1>
                    <p class="text-white/30 text-xl font-medium tracking-[0.3em] uppercase">Zee High School | Library Suite</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                    <div class="sovereign-card p-14 space-y-6"><p class="text-[10px] font-black opacity-30 uppercase tracking-[0.4em]">Active Circulation</p><h3 id="statActiveLoans" class="text-9xl font-serif tracking-tighter">0</h3></div>
                    <div class="sovereign-card p-14 space-y-6"><p class="text-[10px] font-black opacity-30 uppercase tracking-[0.4em]">Archived Logs</p><h3 id="statHistory" class="text-9xl font-serif tracking-tighter">0</h3></div>
                    <div class="sovereign-card p-14 flex flex-col justify-center items-center"><p id="curatorDisplay" class="text-[11px] font-black text-blue-500 uppercase tracking-[0.4em] mb-4">Curator Active</p><div class=\"w-4 h-4 rounded-full bg-blue-500 animate-pulse\"></div></div>
                </div>
                <div class="grid lg:grid-cols-12 gap-24">
                    <div class="lg:col-span-8 space-y-14"><h3 class="text-3xl italic font-serif uppercase tracking-widest opacity-80">Scholar Engagement</h3><div id="leaderboardList" class="space-y-8"></div></div>
                    <div class="lg:col-span-4 space-y-14"><div class="flex justify-between items-center border-b border-white/10 pb-8"><h3 class="text-3xl italic font-serif uppercase tracking-widest opacity-80">Notices</h3><button onclick="openAnnModal()" class="text-4xl opacity-20 hover:opacity-100 transition hover:scale-125">+</button></div><div id="annList" class="space-y-14"></div></div>
                </div>
            </div>

            <!-- Issue Tab -->
            <div id="tab-issue" class="hidden max-w-3xl mx-auto py-10">
                <div class="sovereign-card p-20 space-y-16">
                    <h2 class="text-6xl italic font-serif">Create Entry</h2>
                    <div class="flex flex-col space-y-4">
                        <input type="text" id="admNo" placeholder="SCHOLAR ADMISSION ID" class="w-full text-3xl">
                        <input type="text" id="studentName" placeholder="SCHOLAR FULL NAME" class="w-full text-3xl">
                        <input type="text" id="bookName" placeholder="PUBLICATION TITLE" class="w-full text-3xl">
                        <button onclick="submitIssue()" class="btn-sovereign py-8 mt-10 text-xl">Register Loan</button>
                    </div>
                </div>
            </div>

            <!-- Ledger Tab -->
            <div id="tab-ledger" class="hidden space-y-14">
                <h2 class="text-7xl italic font-serif font-bold tracking-tighter">Active Ledger</h2>
                <div id="issuesTable" class="space-y-8"></div>
            </div>

            <!-- History Tab -->
            <div id="tab-history" class="hidden space-y-14">
                <h2 class="text-7xl italic font-serif font-bold tracking-tighter">History Log</h2>
                <div id="historyTable" class="space-y-8"></div>
            </div>

            <!-- Settings Tab -->
            <div id="tab-settings" class="hidden max-w-3xl mx-auto py-10">
                <div class="sovereign-card p-20 space-y-16">
                    <h2 class="text-6xl italic font-serif">Settings</h2>
                    <div class="space-y-10 border-b border-white/5 pb-12">
                        <p class="text-[10px] font-black uppercase tracking-[0.4em] opacity-30">Theme</p>
                        <div class="flex gap-4">
                            <button onclick="setTheme('dark')" class="flex-1 py-5 sovereign-card text-[10px] font-black uppercase">Obsidian</button>
                            <button onclick="setTheme('light')" class="flex-1 py-5 sovereign-card text-[10px] font-black uppercase bg-white text-black border-none">Alpine</button>
                        </div>
                    </div>
                    <div class="space-y-10 border-b border-white/5 pb-12">
                        <p class="text-[10px] font-black uppercase tracking-[0.4em] opacity-30">Account Security</p>
                        <input type="password" id="newPass" placeholder="NEW PASSWORD" class="w-full text-2xl">
                        <button onclick="updatePassword()" class="btn-sovereign w-full py-6">Update Passkey</button>
                    </div>
                    <div class="flex justify-between items-center">
                        <button onclick="exportBackup()" class="text-[10px] font-black text-blue-500 uppercase tracking-widest">Backup Database</button>
                        <label class="text-[10px] font-black text-emerald-400 uppercase tracking-widest cursor-pointer">Restore Archive <input type="file" onchange="importBackup(event)" class="hidden"></label>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Notice Modal -->
    <div id="annModal" class="fixed inset-0 z-[70] bg-black/95 backdrop-blur-3xl hidden items-center justify-center p-8">
        <div class="sovereign-card p-16 max-w-lg w-full space-y-10 reveal">
            <h3 class="text-4xl italic font-serif">Broadcast</h3>
            <div class="flex flex-col space-y-6">
                <input type="text" id="annTitle" placeholder="HEADLINE" class="text-2xl">
                <textarea id="annDesc" rows="4" placeholder="MESSAGE..." class="text-xl"></textarea>
                <button onclick="submitNotice()" class="btn-sovereign py-6">Publish</button>
                <button onclick="closeAnnModal()" class="text-[10px] font-bold opacity-30 uppercase tracking-widest">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('zhs_users_final')) || [];
        let db = JSON.parse(localStorage.getItem('zhs_db_final')) || { issues: [], history: [], notices: [] };
        let activeUser = null;
        let authMode = 'login';

        function toggleAuthMode(m) {
            authMode = m;
            document.getElementById('loginTab').className = m === 'login' ? 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-white/10 text-white' : 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase text-white/40';
            document.getElementById('registerTab').className = m === 'register' ? 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase bg-white/10 text-white' : 'flex-1 py-3 rounded-xl text-[10px] font-black uppercase text-white/40';
            document.getElementById('authBtn').innerText = m === 'login' ? 'Enter Archive' : 'Create Account';
        }

        function handleAuth() {
            const u = document.getElementById('authUser').value.trim();
            const p = document.getElementById('authPass').value.trim();
            if(!u || !p) return;
            if(authMode === 'register') {
                if(users.find(x => x.u === u)) return alert("User Exists");
                users.push({u, p, theme: 'dark'});
                localStorage.setItem('zhs_users_final', JSON.stringify(users));
                showToast("REGISTERED");
                toggleAuthMode('login');
            } else {
                const user = users.find(x => x.u === u && x.p === p);
                if(user) {
                    activeUser = user;
                    document.getElementById('authOverlay').style.display = 'none';
                    document.getElementById('dashboardApp').classList.remove('hidden');
                    document.getElementById('curatorDisplay').innerText = `CURATOR: ${u.toUpperCase()}`;
                    setTheme(user.theme);
                    refreshUI();
                } else { document.getElementById('authError').classList.remove('hidden'); }
            }
        }

        function setTheme(t) {
            const h = document.getElementById('mainHtml');
            if(t === 'light') h.classList.add('light-theme'); else h.classList.remove('light-theme');
            if(activeUser) { activeUser.theme = t; localStorage.setItem('zhs_users_final', JSON.stringify(users)); }
        }

        function updatePassword() {
            const np = document.getElementById('newPass').value;
            if(!np) return; activeUser.p = np; localStorage.setItem('zhs_users_final', JSON.stringify(users)); showToast("PASSKEY UPDATED");
        }

        function logout() { location.reload(); }
        function saveData() { localStorage.setItem('zhs_db_final', JSON.stringify(db)); refreshUI(); }
        function showToast(t) { const n = document.getElementById('notification'); document.getElementById('notifText').innerText = t; n.classList.add('show'); setTimeout(()=>n.classList.remove('show'), 3000); }

        function switchTab(t) {
            ['dashboard', 'issue', 'ledger', 'history', 'settings'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                document.getElementById(`nav-${tab}`).classList.remove('active');
            });
            document.getElementById(`tab-${t}`).classList.remove('hidden');
            document.getElementById(`nav-${t}`).classList.add('active');
        }

        function submitIssue() {
            const i = { id: Date.now(), adm: document.getElementById('admNo').value, name: document.getElementById('studentName').value, book: document.getElementById('bookName').value, date: new Date().toLocaleDateString() };
            if(!i.adm || !i.book) return; db.issues.push(i); saveData(); showToast("ISSUED"); switchTab('ledger');
        }

        function returnBook(id) {
            const idx = db.issues.findIndex(x => x.id === id);
            const item = db.issues.splice(idx,1)[0];
            item.rDate = new Date().toLocaleDateString(); db.history.unshift(item); saveData(); showToast("RETURNED");
        }

        function refreshUI() {
            document.getElementById('statActiveLoans').innerText = db.issues.length;
            document.getElementById('statHistory').innerText = db.history.length;
            document.getElementById('issuesTable').innerHTML = db.issues.map(i => `
                <div class="sovereign-card p-12 flex justify-between items-center reveal">
                    <div><p class="font-bold text-3xl">${i.name}</p><p class="text-xs opacity-30 mt-2 uppercase tracking-widest">ID: ${i.adm}</p></div>
                    <div class="italic font-serif text-3xl opacity-80">${i.book}</div>
                    <button onclick="returnBook(${i.id})" class="btn-sovereign px-10 py-4 text-xs">Return</button>
                </div>`).join('') || '<p class="text-center opacity-10 uppercase py-20 text-2xl font-black">Ledger Empty</p>';
            document.getElementById('historyTable').innerHTML = db.history.map(i => `
                <div class="sovereign-card p-10 flex justify-between items-center opacity-50 reveal">
                    <div><p class="font-bold text-2xl">${i.name}</p></div>
                    <div class="italic font-serif text-2xl">${i.book}</div>
                    <div class="text-xs font-black uppercase text-blue-500 font-mono">${i.rDate}</div>
                </div>`).join('');
            const c = {}; [...db.issues, ...db.history].forEach(x => c[x.name] = (c[x.name] || 0) + 1);
            const s = Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);
            document.getElementById('leaderboardList').innerHTML = s.map(([n,v],idx) => `
                <div class="sovereign-card p-12 flex justify-between items-center group reveal">
                    <div class="flex items-center gap-12"><span class="text-7xl italic font-serif opacity-10">0${idx+1}</span><p class="font-bold text-4xl tracking-tight">${n}</p></div>
                    <div class="text-right"><span class="text-6xl font-serif italic">${v}</span></div>
                </div>`).join('');
            document.getElementById('annList').innerHTML = db.notices.map(n => `
                <div class="space-y-8 reveal">
                    <div class="flex justify-between border-b border-white/5 pb-4"><span class="text-xs opacity-20 uppercase font-black">${n.date}</span><button onclick=\"deleteNotice(${n.id})\" class=\"text-red-500/20 uppercase text-xs\">Wipe</button></div>
                    <p class=\"text-5xl italic font-serif\">${n.title}</p><p class=\"text-2xl opacity-40 font-light\">${n.desc}</p>
                </div>`).join('');
        }

        function exportBackup() { const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:'application/json'})); link.download = 'Archive_Master.json'; link.click(); }
        function importBackup(e) { const f = e.target.files[0]; const r = new FileReader(); r.onload=(ev) => { db = JSON.parse(ev.target.result); saveData(); showToast(\"RESTORED\"); }; r.readAsText(f); }
        function submitNotice() { db.notices.unshift({ id: Date.now(), title: document.getElementById('annTitle').value, desc: document.getElementById('annDesc').value, date: new Date().toLocaleDateString() }); saveData(); closeAnnModal(); }
        function deleteNotice(id) { db.notices = db.notices.filter(n => n.id !== id); saveData(); }
        function openAnnModal() { document.getElementById('annModal').classList.remove('hidden'); document.getElementById('annModal').classList.add('flex'); }
        function closeAnnModal() { document.getElementById('annModal').classList.add('hidden'); }
    </script>
</body>
</html>
