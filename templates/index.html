    <style>
        :root {
            --bg: #000000;
            --glass: rgba(10, 10, 15, 0.65);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.45);
            --accent: #007AFF;
        }

        .light-theme {
            --bg: #fbfbfd;
            --glass: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(0, 0, 0, 0.12);
            --text-main: #000000;
            --text-dim: #555555;
        }

        body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; transition: all 0.8s ease; min-height: 100vh; overflow-x: hidden; }
        .liquid-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: var(--bg); }
        .liquid-mesh { position: absolute; width: 150vw; height: 150vh; top: -25vh; left: -25vw; background-image: radial-gradient(circle at 20% 30%, rgba(0, 122, 255, 0.18) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(255, 0, 128, 0.08) 0%, transparent 40%); filter: blur(100px); animation: drift 35s infinite alternate; }
        @keyframes drift { from { transform: rotate(0deg); } to { transform: rotate(12deg) scale(1.1); } }

        .glass-card { background: var(--glass); backdrop-filter: blur(80px) saturate(250%) contrast(110%); border: 1px solid var(--glass-border); border-radius: 44px; box-shadow: 0 50px 100px -20px rgba(0,0,0,0.8); position: relative; overflow: hidden; }
        .hero-text { font-family: 'Fraunces', serif; font-weight: 900; background: linear-gradient(180deg, var(--text-main) 60%, var(--text-dim) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-link { font-size: 11px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); transition: 0.4s; padding: 12px 28px; border-radius: 20px; }
        .nav-link.active { color: var(--text-main); background: rgba(255,255,255,0.1); }
        
        .btn-action { background: #FFFFFF; color: #000000; font-weight: 900; border-radius: 24px; transition: 0.5s; text-transform: uppercase; font-size: 13px; letter-spacing: 0.15em; border: none !important; }
        .btn-action:hover { transform: translateY(-6px); box-shadow: 0 30px 50px rgba(0,122,255,0.25); }
        
        input { background: transparent !important; border: none !important; border-bottom: 4px solid var(--glass-border) !important; color: var(--text-main) !important; padding: 1.8rem 0 !important; outline: none !important; transition: 0.5s; font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; font-size: 2.6rem; width: 100%; }
        input:focus { border-bottom-color: var(--accent) !important; }
        .search-input { font-size: 1.4rem !important; padding: 1rem 0 !important; border-bottom-width: 2px !important; margin-bottom: 3rem; }

        #notification { transform: translate(-50%, -150px); transition: 0.6s; z-index: 2000; }
        #notification.show { transform: translate(-50%, 60px); }
        .tag-mono { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 800; background: rgba(0,122,255,0.1); color: var(--accent); padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
        
        /* LOGO STYLE */
        .school-logo { height: 70px; width: auto; object-fit: contain; }
        .login-logo { height: 150px; width: auto; margin: 0 auto 2rem auto; display: block; }
    </style>
</head>

                const doc = await db.collection('curators').doc(u).get();
                if(doc.exists) return alert("User exists");
                await db.collection('curators').doc(u).set({ password: p, theme: 'dark' });
                showToast("ACCOUNT CREATED"); toggleAuth('login');
            } else {
                const doc = await db.collection('curators').doc(u).get();
                if(doc.exists && doc.data().password === p) {
                    activeUser = { u, ...doc.data() };
                    document.getElementById('authOverlay').style.display='none';
                    document.getElementById('dashboardApp').classList.remove('hidden');
                    document.getElementById('curatorName').innerText = u.toUpperCase();
                    setTheme(activeUser.theme); syncCloud();
                } else { document.getElementById('authError').classList.remove('hidden'); }
            }
        }

        async function detectStudent(id) {
            const status = document.getElementById('studentStatus'), newFields = document.getElementById('newStudentFields');
            if (id.length < 2) { status.classList.add('hidden'); newFields.classList.add('hidden'); return; }
            const doc = await db.collection('curators').doc(activeUser.u).collection('students').doc(id).get();
            if (doc.exists) {
                status.classList.remove('hidden'); newFields.classList.add('hidden');
                document.getElementById('foundName').innerText = doc.data().name;
            } else {
                status.classList.add('hidden'); newFields.classList.remove('hidden');
            }
        }

        async function issueNow() {
            const adm = document.getElementById('iAdm').value, book = document.getElementById('iBook').value;
            if(!adm || !book) return alert("Fill all fields");
            
            let name, classSec;
            const doc = await db.collection('curators').doc(activeUser.u).collection('students').doc(adm).get();
            if(doc.exists) {
                name = doc.data().name; classSec = doc.data().class;
            } else {
                name = document.getElementById('iName').value;
                classSec = document.getElementById('iClass').value;
                if(!name || !classSec) return alert("Register Scholar Name & Class");
                await db.collection('curators').doc(activeUser.u).collection('students').doc(adm).set({ name, class: classSec });
            }

            const now = new Date(), due = new Date(); due.setDate(now.getDate() + 7);
            await db.collection('curators').doc(activeUser.u).collection('issues').add({ adm, name, class: classSec, book, issueDate: now.toISOString(), dueDate: due.toISOString() });
            showToast("BOOK ISSUED"); switchTab('ledger');
            ['iAdm', 'iName', 'iClass', 'iBook'].forEach(id => document.getElementById(id).value = '');
            detectStudent('');
        }

        async function retBook(id, data) {
            await db.collection('curators').doc(activeUser.u).collection('history').add({ ...data, returnDate: new Date().toISOString() });
            await db.collection('curators').doc(activeUser.u).collection('issues').doc(id).delete();
            showToast("RETURNED");
        }

        async function delBook(id) {
            if(!confirm("Permanently delete this entry?")) return;
            await db.collection('curators').doc(activeUser.u).collection('issues').doc(id).delete();
            showToast("DELETED");
        }

        function syncCloud() {
            db.collection('curators').doc(activeUser.u).collection('issues').onSnapshot(snap => {
                allIssues = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                filterLedger(''); filterOverdue();
                document.getElementById('statActive').innerText = allIssues.length;
                document.getElementById('statOverdue').innerText = allIssues.filter(i => new Date(i.dueDate) < new Date()).length;
                renderLeaderboard();
            });
            db.collection('curators').doc(activeUser.u).collection('history').orderBy('returnDate', 'desc').onSnapshot(snap => {
                allHistory = snap.docs.map(d => d.data());
                filterHistory('');
                renderLeaderboard();
            });
        }

        function filterLedger(q) {
            const filtered = allIssues.filter(i => i.name.toLowerCase().includes(q.toLowerCase()) || i.adm.includes(q) || i.book.toLowerCase().includes(q.toLowerCase()));
            document.getElementById('ledgerGrid').innerHTML = filtered.map(i => `
                <div class="glass-card p-14 flex justify-between items-center">
                    <div><p class="font-black text-5xl">${i.name} [${i.class}]</p><p class="text-xs opacity-40 uppercase tracking-widest mt-4">ID: ${i.adm} • DUE: ${new Date(i.dueDate).toLocaleDateString()}</p></div>
                    <div class="italic font-serif text-5xl text-blue-500">${i.book}</div>
                    <div class="flex gap-4">
                        <button onclick="retBook('${i.id}', ${JSON.stringify(i).replace(/"/g, '&quot;')})" class="btn-action px-10 py-5 text-xs">Return</button>
                        <button onclick="delBook('${i.id}')" class="btn-action px-10 py-5 text-xs !bg-red-500 !text-white">Wipe</button>
                    </div>
                </div>`).join('');
        }

        function filterHistory(q) {
            const filtered = allHistory.filter(i => i.name.toLowerCase().includes(q.toLowerCase()) || i.adm.includes(q) || i.book.toLowerCase().includes(q.toLowerCase()));
            document.getElementById('historyGrid').innerHTML = filtered.map(i => `
                <div class="glass-card p-14 opacity-50 flex flex-col space-y-8">
                    <div class="flex justify-between items-end">
                        <div><p class="font-black text-5xl">${i.name} [${i.class}]</p><p class="text-xs opacity-40 mt-4 uppercase">ID: ${i.adm}</p></div>
                        <div class="italic font-serif text-5xl">${i.book}</div>
                    </div>
                    <div class="grid grid-cols-2 gap-10 border-t border-white/5 pt-10 font-mono italic">
                        <div class="text-white/30 text-3xl">Issued: ${new Date(i.issueDate).toLocaleDateString()}</div>
                        <div class="text-blue-500 text-3xl">Returned: ${new Date(i.returnDate).toLocaleDateString()}</div>
                    </div>
                </div>`).join('');
        }

        function filterOverdue() {
            const overdue = allIssues.filter(i => new Date(i.dueDate) < new Date());
            document.getElementById('overdueGrid').innerHTML = overdue.map(i => `
                <div class="glass-card p-14 flex justify-between items-center border-red-500/40">
                    <div><p class="font-black text-6xl text-red-500">${i.name} [${i.class}]</p><p class="text-xs opacity-40 mt-4">ADM: ${i.adm}</p></div>
                    <div class="text-right"><p class="italic font-serif text-5xl">${i.book}</p></div>
                </div>`).join('') || '<p class="text-center opacity-10 text-9xl py-40">Zero Overdue</p>';
        }

        async function renderLeaderboard() {
            const c = {}; [...allHistory, ...allIssues].forEach(i => { c[i.name] = (c[i.name] || 0) + 1; });
            const s = Object.entries(c).sort((a,b) => b[1] - a[1]).slice(0, 9);
            document.getElementById('leadGrid').innerHTML = s.map(([n, v], idx) => `
                <div class="glass-card p-16 space-y-6">
                    <span class="text-7xl italic font-serif opacity-10">0${idx+1}</span>
                    <p class="font-black text-4xl tracking-tighter">${n}</p>
                    <p class="text-blue-500 font-bold uppercase text-xs">${v} Books Borrowed</p>
                </div>`).join('');
        }

        function switchTab(t) {
            ['dashboard', 'issue', 'ledger', 'overdue', 'history', 'settings'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                document.getElementById(`nav-${tab}`).classList.remove('active');
            });
            document.getElementById(`tab-${t}`).classList.remove('hidden');
            document.getElementById(`nav-${t}`).classList.add('active');
        }

        function setTheme(t) {
            const h = document.getElementById('mainHtml');
            t === 'light' ? h.classList.add('light-theme') : h.classList.remove('light-theme');
            if(activeUser) db.collection('curators').doc(activeUser.u).update({ theme: t });
        }

        function exportCSV() {
            let csv = "Admission ID,Name,Class,Book Code,Issue Date,Return Date\n";
            allHistory.forEach(i => { csv += `${i.adm},${i.name},${i.class},${i.book},${i.issueDate},${i.returnDate}\n`; });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            link.download = "Library_Report.csv"; link.click();
        }

        function showToast(t) {
            const n = document.getElementById('notification');
            document.getElementById('notifText').innerText = t;
            n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
